<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel del negocio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Vista de login -->
  <main id="login-view" class="login-screen">
    <form id="login-form" class="login-card" autocomplete="off">
      <img
        id="fox-welcome"
        class="login-fox"
        src="img/fox-welcome.svg"
        alt="Zorro mascota de RecepIA dando la bienvenida"
        width="120"
        height="120"
      />
      <div class="login-brand">
        <span class="login-brand-dot"></span>
        <span>Recep IA</span>
      </div>
      <div class="login-logo">
        <svg class="login-logo-icon" width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="32" fill="#00d4aa"></circle>
          <rect x="16" y="20" width="32" height="22" rx="11" fill="#ffffff"></rect>
          <path d="M22 42 L22 50 L30 42 Z" fill="#ffffff"></path>
          <circle cx="26" cy="31" r="2.2" fill="#00d4aa"></circle>
          <circle cx="32" cy="31" r="2.2" fill="#00d4aa"></circle>
          <circle cx="38" cy="31" r="2.2" fill="#00d4aa"></circle>
        </svg>
        <span class="login-logo-name">RecepIA</span>
      </div>
      <h1>Panel del negocio</h1>
      <p class="login-subtitle">Accede con el ID de tu negocio y tu contraseña.</p>

      <label class="field">
        <span>ID del negocio</span>
        <input type="text" id="business-id-input" placeholder="id-de-tu-negocio" required />
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input type="password" id="api-key-input" placeholder="••••••••••••" required />
      </label>

      <button type="submit" class="btn-primary" id="login-submit">Entrar</button>
      <p class="login-error" id="login-error" hidden></p>
    </form>
  </main>

  <!-- Vista de dashboard -->
  <div id="dashboard-view" class="dashboard" hidden>
    <header class="dashboard-header">
      <div class="header-left">
        <img
          id="fox-working"
          class="header-fox"
          src="img/fox-working.svg"
          alt="Zorro mascota de RecepIA"
          width="48"
          height="48"
        />
        <div>
          <h1 id="business-name">—</h1>
          <p class="header-subtitle">Panel de gestión · WhatsApp Bot</p>
        </div>
      </div>
      <div class="header-right">
        <span id="bot-status" class="status-badge status-unknown">
          <svg class="status-dot" viewBox="0 0 8 8" aria-hidden="true"><circle cx="4" cy="4" r="4"></circle></svg>
          <span id="bot-status-text">Comprobando…</span>
        </span>
        <img
          id="fox-sleeping"
          class="status-fox"
          src="img/fox-sleeping.svg"
          alt="Zorro dormido: bot fuera de horario"
          width="40"
          height="40"
          hidden
        />
        <span id="today-messages" class="today-messages">Mensajes hoy: —</span>
        <button id="logout-btn" class="btn-ghost" type="button">Salir</button>
      </div>
    </header>

    <section class="metrics-grid" aria-label="Métricas del mes">
      <article class="metric-card">
        <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 17 9 11 13 15 21 6"></polyline>
          <polyline points="15 6 21 6 21 12"></polyline>
        </svg>
        <span class="metric-label">Leads este mes</span>
        <span class="metric-value" id="metric-total-leads">0</span>
      </article>
      <article class="metric-card">
        <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="8 12.5 11 15.5 16 9"></polyline>
        </svg>
        <span class="metric-label">Citas confirmadas</span>
        <span class="metric-value" id="metric-confirmed">0</span>
        <img
          id="fox-confirmed"
          class="confirmed-fox"
          src="img/fox-celebrating.svg"
          alt="Zorro celebrando: hay citas confirmadas"
          width="64"
          height="64"
          hidden
        />
      </article>
      <article class="metric-card">
        <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15.5 14"></polyline>
        </svg>
        <span class="metric-label">Citas pendientes</span>
        <span class="metric-value" id="metric-pending">0</span>
      </article>
      <article class="metric-card metric-card-accent">
        <svg class="metric-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"></circle>
          <circle cx="12" cy="12" r="4.5"></circle>
          <circle cx="12" cy="12" r="0.5"></circle>
        </svg>
        <span class="metric-label">Tasa de conversión</span>
        <span class="metric-value" id="metric-conversion">0%</span>
      </article>
    </section>

    <section class="leads-section">
      <div class="leads-toolbar">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Buscar por nombre o teléfono…"
        />
        <div class="status-filters" id="status-filters" role="tablist" aria-label="Filtrar por estado">
          <button type="button" class="filter-chip is-active" data-status="all">Todos</button>
          <button type="button" class="filter-chip" data-status="new">Nuevo</button>
          <button type="button" class="filter-chip" data-status="contacted">Contactado</button>
          <button type="button" class="filter-chip" data-status="confirmed">Confirmado</button>
          <button type="button" class="filter-chip" data-status="cancelled">Cancelado</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="leads-table">
          <thead>
            <tr>
              <th data-sort="name">Nombre <span class="sort-arrow"></span></th>
              <th data-sort="phone">Teléfono <span class="sort-arrow"></span></th>
              <th data-sort="service">Servicio <span class="sort-arrow"></span></th>
              <th data-sort="preferredDate">Fecha preferida <span class="sort-arrow"></span></th>
              <th data-sort="preferredTime">Hora <span class="sort-arrow"></span></th>
              <th data-sort="status">Estado <span class="sort-arrow"></span></th>
            </tr>
          </thead>
          <tbody id="leads-tbody">
            <tr>
              <td colspan="6" class="empty-row">Cargando leads…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
